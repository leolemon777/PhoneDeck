plugins {
    id "com.android.application"
}

def phoneDeckSigningPropertiesPath = System.getenv("PHONEDECK_SIGNING_PROPERTIES")
def phoneDeckSigningPropertiesFile = phoneDeckSigningPropertiesPath
        ? new File(phoneDeckSigningPropertiesPath) : rootProject.file("../signing/signing.properties")
def phoneDeckSigningProperties = new Properties()
def hasPhoneDeckSigning = phoneDeckSigningPropertiesFile.exists()
def isolatedUiPreview = project.hasProperty("phoneDeckIsolatedUiPreview")

if (hasPhoneDeckSigning) {
    phoneDeckSigningPropertiesFile.withInputStream {
        phoneDeckSigningProperties.load(it)
    }
}

android {
    namespace "com.codex.phonedeck"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.phonedeck"
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName "1.6.0-dev.22"
        resValue "string", "app_name", "言渡"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasPhoneDeckSigning) {
            phoneDeck {
                storeFile new File(phoneDeckSigningPropertiesFile.parentFile,
                        phoneDeckSigningProperties["storeFile"])
                storePassword phoneDeckSigningProperties["storePassword"]
                keyAlias phoneDeckSigningProperties["keyAlias"]
                keyPassword phoneDeckSigningProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            if (hasPhoneDeckSigning) {
                signingConfig signingConfigs.phoneDeck
            }
        }

        release {
            minifyEnabled false
            if (hasPhoneDeckSigning) {
                signingConfig signingConfigs.phoneDeck
            }
        }

        // Separate data/package identity for visual review when the installed
        // development certificate is unavailable. Never a fleet-update artifact.
        uiPreview {
            initWith debug
            applicationIdSuffix isolatedUiPreview ? ".dialoguepreview" : ".preview"
            versionNameSuffix "-ui-preview"
            signingConfig signingConfigs.debug
            resValue "string", "app_name", isolatedUiPreview ? "言渡·对话白" : "言渡 UI 预览"
        }

        // Stable owner-signed candidate, separate from both legacy fleet updates and ADB UI fixtures.
        desktopPreview {
            initWith release
            applicationIdSuffix ".desktoppreview"
            versionNameSuffix ""
            debuggable false
            resValue "string", "app_name", "言渡"
            matchingFallbacks = ["release"]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

androidComponents {
    onVariants(selector().withBuildType("uiPreview")) { variant ->
        variant.outputs.each { output ->
            output.versionName.set("1.6.0-dev.22-ui-preview.1")
            output.versionCode.set(29)
        }
    }
    onVariants(selector().withBuildType("desktopPreview")) { variant ->
        variant.outputs.each { output ->
            output.versionName.set("2.0.0-alpha.1")
            output.versionCode.set(4)
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.configureEach {
    if (name == "packageDesktopPreview") {
        doFirst {
            if (!hasPhoneDeckSigning) {
                throw new GradleException("Desktop preview distribution requires the owner's fixed signing.properties. Use uiPreview for development only.")
            }
        }
    }
}

// Gradle's Windows test worker can lose loose .class directories when the
// workspace path contains CJK characters. Package them first so local unit
// tests remain runnable from PhoneDeck's normal Chinese workspace path.
def debugUnitTestJar = tasks.register("debugUnitTestJar", Jar) {
    dependsOn("compileDebugUnitTestJavaWithJavac", "compileDebugJavaWithJavac")
    from(layout.buildDirectory.dir(
            "intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes"))
    from(layout.buildDirectory.dir(
            "intermediates/javac/debug/compileDebugJavaWithJavac/classes"))
    archiveFileName = "phonedeck-${rootProject.projectDir.absolutePath.hashCode()}-debug-unit-tests.jar"
    destinationDirectory = file("${gradle.gradleUserHomeDir}/phonedeck-test-cache")
}

tasks.withType(Test).configureEach {
    if (name == "testDebugUnitTest") {
        dependsOn(debugUnitTestJar)
        doFirst {
            def testsJar = debugUnitTestJar.get().archiveFile.get().asFile
            classpath = files(testsJar) + classpath
        }
    }
}
