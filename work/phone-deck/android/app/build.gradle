plugins {
    id "com.android.application"
}

def phoneDeckSigningPropertiesFile = rootProject.file("../signing/signing.properties")
def phoneDeckSigningProperties = new Properties()
def hasPhoneDeckSigning = phoneDeckSigningPropertiesFile.exists()

if (hasPhoneDeckSigning) {
    phoneDeckSigningPropertiesFile.withInputStream {
        phoneDeckSigningProperties.load(it)
    }
}

android {
    namespace "com.codex.phonedeck"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.phonedeck"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasPhoneDeckSigning) {
            phoneDeck {
                storeFile rootProject.file("../signing/${phoneDeckSigningProperties["storeFile"]}")
                storePassword phoneDeckSigningProperties["storePassword"]
                keyAlias phoneDeckSigningProperties["keyAlias"]
                keyPassword phoneDeckSigningProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            if (hasPhoneDeckSigning) {
                signingConfig signingConfigs.phoneDeck
            }
        }

        release {
            minifyEnabled false
            if (hasPhoneDeckSigning) {
                signingConfig signingConfigs.phoneDeck
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
