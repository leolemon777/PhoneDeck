plugins {
    id "com.android.application"
}

android {
    namespace "com.codex.phonedeck"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.phonedeck"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
