name: Cross-platform Desktop Preview
on:
  pull_request:
    paths: ['work/phone-deck/desktop/**','work/phone-deck/android/**','scripts/build-desktop.ps1','scripts/desktop/**','docs/DESKTOP_*.md','.github/workflows/desktop-preview.yml','Directory.Build.targets','global.json']
  workflow_dispatch:
    inputs:
      include_model:
        description: Bundle verified multilingual model for offline first use
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Windows package compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.3 --no-progress -y
          (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6') | Add-Content $env:GITHUB_PATH
      - name: Test and package native runtime
        id: package
        shell: pwsh
        env:
          INCLUDE_MODEL: ${{ inputs.include_model || false }}
        run: |
          ./scripts/build-desktop.ps1 -Rid '${{ matrix.rid }}' -IncludeModel:($env:INCLUDE_MODEL -eq 'true')
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Desktop-${{ matrix.rid }}
          retention-days: 7
          path: |
            ${{ steps.package.outputs.package_directory }}/*.zip
            ${{ steps.package.outputs.package_directory }}/*.gz
            ${{ steps.package.outputs.package_directory }}/*.exe
            ${{ steps.package.outputs.package_directory }}/*.deb
            ${{ steps.package.outputs.package_directory }}/checksums.sha256
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build isolated Android preview
        working-directory: work/phone-deck/android
        run: bash gradlew :app:assembleUiPreview :app:lintUiPreview :app:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Android-Preview
          path: work/phone-deck/android/app/build/outputs/apk/uiPreview/*.apk
          retention-days: 7
